[package]
name = "lau-solid-mechanics"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Continuum mechanics library — stress, strain, deformation, beam mechanics, FEM basics, and yield criteria for solids"
repository = "https://github.com/SuperInstance/lau-solid-mechanics"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
